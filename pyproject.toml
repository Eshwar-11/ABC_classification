[project]
name = "addverb-abc-classifier"
version = "0.1.1"
description = "WMS SKU classification module. Satwik v2.1 scope."
requires-python = ">=3.11,<3.16"
authors = [{ name = "Eshwar", email = "b.eshwar13@gmail.com" }]
license = { text = "Proprietary" }

# NOTE on Python compatibility:
# - Python 3.11, 3.12, 3.13: pandas 2.2 .. 3.1 with wheels; no build tools needed.
# - Python 3.14: use pandas 2.3.x (2.2.3 has no 3.14 wheels).
# - Python 3.15: requires pandas >= 3.0 and numpy >= 2.5 (earlier versions have no wheels).
# pyarrow is optional on 3.15 and only needed for .parquet input; xlsx and csv work without it.

[project.scripts]
abc-classify-serve = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
