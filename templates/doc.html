{% extends "base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-head"><div><div class="panel-title">{{ title }}</div></div></div>
  <div class="panel-body">
    <article id="mdbody" style="font-size:13px;line-height:1.6;max-width:820px"></article>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const md = {{ markdown | tojson }};
  document.getElementById('mdbody').innerHTML = marked.parse(md);
</script>
{% endblock %}
