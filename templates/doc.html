{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <div class="sub">Scoring rationale, defaults, and design decisions for the classifier.</div>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <article id="mdbody" class="md-body"></article>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const md = {{ markdown | tojson }};
  document.getElementById('mdbody').innerHTML = marked.parse(md);
</script>
{% endblock %}
