<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}Addverb · ABC Classification{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script>
  // Theme + sidebar-collapse state restored before first paint to avoid flash.
  (function () {
    try {
      const theme = localStorage.getItem('abc-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="app" id="app">

  <!-- =====================================================
       SIDEBAR
       ===================================================== -->
  <aside class="sidebar">

    <div class="brand">
      <!-- Addverb mark. Replace with <img src="/static/brand.svg">
           once the official SVG lands. The red tile + typography
           below follows Addverb's post-rebrand visual identity. -->
      <div class="brand-mark" aria-label="Addverb">A</div>
      <div class="brand-text">
        <span class="brand-name">ADDVERB<span class="dot">.</span></span>
        <span class="brand-sub">ABC Classify</span>
      </div>
    </div>

    <div class="nav-group">Analysis</div>
    <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}" data-label="New classification">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span class="nav-label">New classification</span>
    </a>
    <a href="/order-profile" class="nav-item {% if request.url.path == '/order-profile' %}active{% endif %}" data-label="Order profile">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/><circle cx="7" cy="15" r="1.4"/><circle cx="11" cy="11" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="19" cy="8" r="1.4"/></svg>
      <span class="nav-label">Order profile</span>
    </a>
    <a href="/runs" class="nav-item {% if request.url.path == '/runs' %}active{% endif %}" data-label="All runs">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/></svg>
      <span class="nav-label">All runs</span>
    </a>
    <a href="/dashboard" class="nav-item {% if request.url.path.startswith('/dashboard') %}active{% endif %}" data-label="Changes">
      <svg viewBox="0 0 24 24"><path d="M3 12l4-4 4 4 4-6 6 10"/><path d="M3 20h18"/></svg>
      <span class="nav-label">Changes</span>
    </a>

    <div class="nav-group">Reference</div>
    <a href="/docs/logic" class="nav-item {% if request.url.path == '/docs/logic' %}active{% endif %}" data-label="Methodology">
      <svg viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4V4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="nav-label">Methodology</span>
    </a>
    <a href="/docs" class="nav-item" data-label="API reference">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v14a2 2 0 002 2h3M16 3h3a2 2 0 012 2v14a2 2 0 01-2 2h-3"/><path d="M10 8l-2 4 2 4M14 8l2 4-2 4"/></svg>
      <span class="nav-label">API reference</span>
    </a>

    <!-- Sidebar footer: user + theme + collapse -->
    <div class="sidebar-footer">
      <span class="user" title="Operator">eshwar@addverb</span>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="collapse-btn" onclick="toggleCollapse()" title="Collapse sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </aside>

  <!-- =====================================================
       MAIN
       ===================================================== -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>

<script>
  // Theme toggle, selected not auto
  function toggleTheme() {
    const r = document.documentElement;
    const cur = r.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', next);
    try { localStorage.setItem('abc-theme', next); } catch (e) {}
  }

  // Sidebar collapse toggle, persists via localStorage
  function toggleCollapse() {
    const app = document.getElementById('app');
    const now = app.getAttribute('data-collapsed') === 'true';
    const next = !now;
    app.setAttribute('data-collapsed', next ? 'true' : 'false');
    try { localStorage.setItem('abc-sidebar-collapsed', next ? '1' : '0'); } catch (e) {}
  }
  (function hydrateCollapsed() {
    try {
      if (localStorage.getItem('abc-sidebar-collapsed') === '1') {
        document.getElementById('app').setAttribute('data-collapsed', 'true');
      }
    } catch (e) {}
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
